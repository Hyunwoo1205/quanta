name: Atomistic A04 final validation batch

on:
  push:
    branches: [main]
    paths:
      - docs/design/atomistic-a04-v0.1/a04-final-validation-inputs.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: atomistic-a04-final
  cancel-in-progress: false

jobs:
  f0:
    name: F0 fixed input and evidence checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          architecture: x64
      - name: Verify baseline assets and final deck digests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -B scripts/check_atomistic_a02.py
          python -B scripts/run_atomistic_a04_final_x86.py --check-manifest
  f1:
    needs: f0
    uses: ./.github/workflows/atomistic-a04-resource-ci.yml
    with:
      experiment: final-f1
  f2:
    needs: f1
    uses: ./.github/workflows/atomistic-a04-resource-ci.yml
    with:
      experiment: final-f2
  f3:
    needs: f2
    uses: ./.github/workflows/atomistic-a04-resource-ci.yml
    with:
      experiment: final-f3
  f4:
    needs: f3
    uses: ./.github/workflows/atomistic-a04-final-arm.yml
  f5:
    name: F5 bounded batch decision
    needs: [f0, f1, f2, f3, f4]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: final-receipt-*-${{ github.run_attempt }}
          path: .cache/a04-final-results
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.f4.result != 'skipped'
        with:
          pattern: final-f4-*-${{ github.run_attempt }}
          path: .cache/a04-final-results
          digest-mismatch: error
      - name: Classify the admitted development scope
        env:
          PHASES: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          phases = {key: value["result"] for key, value in json.loads(os.environ["PHASES"]).items()}
          reports = []
          run_id = os.environ["GITHUB_RUN_ID"]
          source = os.environ["GITHUB_SHA"]
          for path in sorted(Path(".cache/a04-final-results").glob("*/report.json")):
              raw = path.read_bytes()
              report = json.loads(raw)
              assert report["quanta_source"] == source and str(report["workflow_run_id"]) == run_id
              reports.append({
                  "stage": report["stage"], "system": report["system"], "status": report["status"],
                  "gate_failures": report.get("gate_failures", []), "report_sha256": hashlib.sha256(raw).hexdigest(),
              })
          if any(row["gate_failures"] or row["status"] == "criterion_not_met" for row in reports):
              state = "closed_no_go"
          elif all(value == "success" for value in phases.values()):
              state = "frozen_for_exact_scope"
          else:
              state = "closed_incomplete"
          result = {"workflow_run_id": int(run_id), "quanta_source": source, "phases": phases,
                    "reports": reports, "state": state, "oci": "requires_separate_admission",
                    "physical_validation_status": "unvalidated"}
          Path("a04-final-decision.json").write_text(json.dumps(result, indent=2) + "\n")
          print("QUANTA_A04_FINAL_DECISION " + json.dumps(result, separators=(",", ":")))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-decision-${{ github.run_attempt }}
          path: a04-final-decision.json
          if-no-files-found: error
          retention-days: 14
