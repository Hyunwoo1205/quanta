name: Contract and environment checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-04 (UTC+09:00)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-11-04 (UTC+09:00)
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install exact locked wheels and editable package
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.lock.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Check observed environment
        run: python scripts/check_environment.py
      - name: Check contracts and canonicalization
        run: python -m quanta check-contracts
      - name: Run tests
        run: python -m pytest
      - name: Measure named numerical benchmarks
        run: python scripts/verify_numerics.py --output .cache/numerical_verification.json
      - name: Measure constrained relaxation benchmark
        run: python scripts/verify_relaxation.py --output .cache/relaxation_verification.json
      - name: Measure stationary quantum benchmarks
        run: python scripts/verify_quantum.py --output .cache/quantum_verification.json
      - name: Measure multi-step workflow evidence
        run: python scripts/verify_workflow.py --output .cache/workflow_verification.json
      - name: Preserve actual numerical measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified 2026-11-04 (UTC+09:00)
        with:
          name: numerical-verification-${{ github.sha }}
          path: |
            .cache/numerical_verification.json
            .cache/relaxation_verification.json
            .cache/quantum_verification.json
            .cache/workflow_verification.json
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Validate example input
        run: python -m quanta validate contracts/v0.2.0/examples/pair_revision.json
      - name: Evaluate a single configuration
        run: python -m quanta evaluate examples/pair_energy_forces.json
      - name: Relax a constrained configuration
        run: python -m quanta relax examples/pair_relax.json
      - name: Calculate stationary quantum states
        run: python -m quanta eigenstates examples/quantum_eigenstates.json
      - name: Plan, run and replay supported workflows
        run: |
          python -m quanta plan examples/pair_workflow.json --format text
          python -m quanta run examples/pair_workflow.json --output-dir .cache/ci-pair-run --format text
          python -m quanta replay .cache/ci-pair-run --output-dir .cache/ci-pair-replay --format text
          python -m quanta run examples/quantum_workflow.json --output-dir .cache/ci-quantum-run --format text
      - name: Build pinned-base container
        run: docker build --platform linux/amd64 --tag quanta-contracts-ci .
      - name: Check installed-wheel container
        run: |
          docker run --rm --workdir /tmp quanta-contracts-ci python -m quanta check-contracts
          docker run --rm --workdir /tmp quanta-contracts-ci python -m quanta environment
          docker run --rm --workdir /tmp quanta-contracts-ci python -m quanta evaluate /app/examples/pair_energy_forces.json
          docker run --rm --workdir /tmp quanta-contracts-ci python -m quanta relax /app/examples/pair_relax.json
          docker run --rm --workdir /tmp quanta-contracts-ci python -m quanta eigenstates /app/examples/quantum_eigenstates.json
          docker run --rm --workdir /tmp quanta-contracts-ci sh -c 'python -m quanta plan /app/examples/pair_workflow.json --format text && python -m quanta run /app/examples/pair_workflow.json --output-dir /tmp/quanta-run --format text && python -m quanta replay /tmp/quanta-run --output-dir /tmp/quanta-replay --format text && python -m quanta run /app/examples/quantum_workflow.json --output-dir /tmp/quanta-quantum-run --format text'
