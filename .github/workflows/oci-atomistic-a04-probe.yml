name: OCI fixed atomistic A04 trial

on:
  push:
    branches:
      - ops/oci
    paths:
      - .github/oci/atomistic-a04-request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: quanta-oci-installation
  cancel-in-progress: false

env:
  # The ops/oci workflow pins the reviewed main commit and its successful full CI.
  # These inert values allow the main control source to pass CI before it is pinned.
  QUANTA_ATOMISTIC_A04_CONTROL_SHA: '0000000000000000000000000000000000000000'
  QUANTA_ATOMISTIC_A04_CONTROL_CI_RUN: '0'

jobs:
  atomistic:
    if: github.repository == 'Hyunwoo1205/quanta' && github.ref == 'refs/heads/ops/oci' && github.event_name == 'push' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    environment: oci-preflight
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout the fixed verified control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.QUANTA_ATOMISTIC_A04_CONTROL_SHA }}
          path: verified-atomistic-a04-control
          persist-credentials: false
      - name: Require the same-source full CI, native ARM qualification and exact candidate
        id: authorize
        env:
          QUANTA_CI_READ_TOKEN: ${{ github.token }}
        run: python3 -I -B verified-atomistic-a04-control/deploy/oci/authorize_atomistic_a04_probe.py
      - name: Download the exact qualified native ARM candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          run-id: ${{ steps.authorize.outputs.candidate_native_run }}
          artifact-ids: ${{ steps.authorize.outputs.candidate_artifact_id }}
          path: .cache/armv8a-candidate
          github-token: ${{ github.token }}
          digest-mismatch: error
      - name: Install the existing-key SSH transport
        run: |
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends putty-tools
      - name: Reauthorize and execute the fixed isolated trial
        env:
          QUANTA_CI_READ_TOKEN: ${{ github.token }}
          QUANTA_ATOMISTIC_A04_OPERATION: ${{ steps.authorize.outputs.operation }}
          QUANTA_ATOMISTIC_A04_SOURCE_SHA: ${{ steps.authorize.outputs.source_sha }}
          QUANTA_ATOMISTIC_A04_REQUEST_ID: ${{ steps.authorize.outputs.request_id }}
          QUANTA_ATOMISTIC_A04_CANDIDATE_ARTIFACT_ID: ${{ steps.authorize.outputs.candidate_artifact_id }}
          QUANTA_ATOMISTIC_A04_CANDIDATE_ARTIFACT_DIGEST: ${{ steps.authorize.outputs.candidate_artifact_digest }}
          QUANTA_OCI_AUTH_CONFIRMED: 'true'
          QUANTA_OCI_HOST: ${{ secrets.QUANTA_OCI_HOST }}
          QUANTA_OCI_HOST_KEY: ${{ secrets.QUANTA_OCI_HOST_KEY }}
          QUANTA_OCI_PPK: ${{ secrets.QUANTA_OCI_PPK }}
        run: |
          mkdir -p .cache
          python3 -I -B verified-atomistic-a04-control/deploy/oci/probe_atomistic_a04.py > .cache/oci-atomistic-a04-report.json
      - name: Preserve the sanitized trial receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oci-atomistic-a04-${{ github.sha }}
          path: .cache/oci-atomistic-a04-report.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
