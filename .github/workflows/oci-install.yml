name: OCI fixed installation

on:
  push:
    branches:
      - ops/oci
    paths:
      - .github/oci/install-request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: quanta-oci-installation
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'Hyunwoo1205/quanta' && github.ref == 'refs/heads/ops/oci' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: oci-preflight
    timeout-minutes: 20
    outputs:
      operation: ${{ steps.authorize.outputs.operation || steps.authorize-recovery.outputs.operation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Classify the fixed recovery request
        id: classify
        run: |
          python3 -I - <<'PY_REQUEST'
          import json, os
          from pathlib import Path
          value = json.loads(Path('.github/oci/install-request.json').read_bytes())
          operation = value.get('operation') if isinstance(value, dict) else None
          recovery = isinstance(operation, str) and operation in {'audit-recovery', 'prepare-recovery', 'export-recovery', 'reboot-recovery', 'verify-reboot', 'post-reboot-compute', 'compare-recovery', 'refresh-recovery', 'diagnose-peer-recovery'}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('recovery=' + ('true' if recovery else 'false') + '\n')
          PY_REQUEST
      - name: Checkout separately verified recovery control
        if: steps.classify.outputs.recovery == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5aa8d5fee8cd9cadcdf6e2c75a5033bfe72a779e
          path: verified-control
          persist-credentials: false
      - name: Authorize app and recovery control CI pins
        if: steps.classify.outputs.recovery == 'true'
        id: authorize-recovery
        env:
          QUANTA_CONTROL_SHA: '5aa8d5fee8cd9cadcdf6e2c75a5033bfe72a779e'
          QUANTA_CONTROL_CI_RUN: '42165696689'
          QUANTA_CI_READ_TOKEN: ${{ github.token }}
        run: python3 -I -B verified-control/deploy/oci/authorize_recovery.py
      - name: Authorize the fixed request and completed native CI
        if: steps.classify.outputs.recovery != 'true'
        id: authorize
        env:
          QUANTA_CI_READ_TOKEN: ${{ github.token }}
        run: python3 -I deploy/oci/authorize_install.py
      - name: Install Plink on the GitHub runner
        run: |
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends putty-tools
      - name: Verify native nftables rules in an isolated network namespace
        if: steps.authorize.outputs.operation == 'configure-web-firewall'
        run: |
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nftables
          sudo -n unshare --net /usr/bin/python3 -I deploy/oci/verify_nft_namespace.py
      - name: Execute the authorized fixed installer
        id: install
        if: steps.classify.outputs.recovery != 'true' && steps.authorize.outputs.operation != 'configure-acme'
        env:
          QUANTA_OCI_AUTH_CONFIRMED: 'true'
          QUANTA_OCI_INSTALL_OPERATION: ${{ steps.authorize.outputs.operation }}
          QUANTA_OCI_HOST: ${{ secrets.QUANTA_OCI_HOST }}
          QUANTA_OCI_HOST_KEY: ${{ secrets.QUANTA_OCI_HOST_KEY }}
          QUANTA_OCI_PPK: ${{ secrets.QUANTA_OCI_PPK }}
          QUANTA_PUBLIC_ORIGIN: ${{ secrets.QUANTA_PUBLIC_ORIGIN }}
          QUANTA_AUTH_MODE: ${{ secrets.QUANTA_AUTH_MODE }}
        run: python3 -I deploy/oci/probe_install.py
      - name: Execute the verified fixed recovery operation
        if: steps.classify.outputs.recovery == 'true'
        id: recovery
        env:
          QUANTA_CONTROL_SHA: '5aa8d5fee8cd9cadcdf6e2c75a5033bfe72a779e'
          QUANTA_CONTROL_CI_RUN: '42165696689'
          QUANTA_OCI_AUTH_CONFIRMED: 'true'
          QUANTA_OCI_INSTALL_OPERATION: ${{ steps.authorize-recovery.outputs.operation }}
          QUANTA_OCI_HOST: ${{ secrets.QUANTA_OCI_HOST }}
          QUANTA_OCI_HOST_KEY: ${{ secrets.QUANTA_OCI_HOST_KEY }}
          QUANTA_OCI_PPK: ${{ secrets.QUANTA_OCI_PPK }}
          QUANTA_PUBLIC_ORIGIN: ${{ secrets.QUANTA_PUBLIC_ORIGIN }}
          QUANTA_AUTH_MODE: ${{ secrets.QUANTA_AUTH_MODE }}
        run: python3 -I -B verified-control/deploy/oci/probe_recovery.py
      - name: Preserve encrypted backup transfer only
        if: steps.authorize-recovery.outputs.operation == 'export-recovery' && steps.recovery.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-recovery-backup-${{ github.run_id }}
          path: .cache/recovery-backup.cms
          if-no-files-found: error
          retention-days: 1
      - name: Configure the explicitly selected ACME provider
        if: steps.authorize.outputs.operation == 'configure-acme'
        env:
          QUANTA_OCI_AUTH_CONFIRMED: 'true'
          QUANTA_OCI_INSTALL_OPERATION: ${{ steps.authorize.outputs.operation }}
          QUANTA_OCI_HOST: ${{ secrets.QUANTA_OCI_HOST }}
          QUANTA_OCI_HOST_KEY: ${{ secrets.QUANTA_OCI_HOST_KEY }}
          QUANTA_OCI_PPK: ${{ secrets.QUANTA_OCI_PPK }}
          QUANTA_PUBLIC_ORIGIN: ${{ secrets.QUANTA_PUBLIC_ORIGIN }}
          QUANTA_AUTH_MODE: ${{ secrets.QUANTA_AUTH_MODE }}
          QUANTA_ACME_EMAIL: ${{ secrets.QUANTA_ACME_EMAIL }}
        run: python3 -I deploy/oci/probe_install.py
  public:
    needs: install
    if: ${{ !cancelled() && (needs.install.outputs.operation == 'install-https' || needs.install.outputs.operation == 'configure-web-firewall' || needs.install.outputs.operation == 'diagnose-https' || needs.install.outputs.operation == 'configure-acme' || needs.install.outputs.operation == 'verify-reboot' || needs.install.outputs.operation == 'post-reboot-compute' || needs.install.outputs.operation == 'compare-recovery') }}
    runs-on: ubuntu-24.04
    environment: oci-preflight
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify the public HTTPS entry without owner credentials
        env:
          QUANTA_PUBLIC_ORIGIN: ${{ secrets.QUANTA_PUBLIC_ORIGIN }}
          QUANTA_AUTH_MODE: ${{ secrets.QUANTA_AUTH_MODE }}
          QUANTA_OCI_HOST: ${{ secrets.QUANTA_OCI_HOST }}
        run: python3 -I deploy/oci/probe_public.py
