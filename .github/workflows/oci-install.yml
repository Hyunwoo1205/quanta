name: OCI fixed installation

on:
  push:
    branches:
      - ops/oci
    paths:
      - .github/oci/install-request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: quanta-oci-installation
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'Hyunwoo1205/quanta' && github.ref == 'refs/heads/ops/oci' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: oci-preflight
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Authorize the fixed request and completed native CI
        id: authorize
        env:
          QUANTA_CI_READ_TOKEN: ${{ github.token }}
        run: python3 -I deploy/oci/authorize_install.py
      - name: Install Plink on the GitHub runner
        run: |
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends putty-tools
      - name: Execute the authorized fixed installer
        id: install
        env:
          QUANTA_OCI_AUTH_CONFIRMED: 'true'
          QUANTA_OCI_INSTALL_OPERATION: ${{ steps.authorize.outputs.operation }}
          QUANTA_OCI_HOST: ${{ secrets.QUANTA_OCI_HOST }}
          QUANTA_OCI_HOST_KEY: ${{ secrets.QUANTA_OCI_HOST_KEY }}
          QUANTA_OCI_PPK: ${{ secrets.QUANTA_OCI_PPK }}
          QUANTA_PUBLIC_ORIGIN: ${{ secrets.QUANTA_PUBLIC_ORIGIN }}
          QUANTA_AUTH_MODE: ${{ secrets.QUANTA_AUTH_MODE }}
        run: python3 -I deploy/oci/probe_install.py
      - name: Verify the public HTTPS entry without owner credentials
        if: ${{ !cancelled() && (steps.authorize.outputs.operation == 'install-https' || steps.authorize.outputs.operation == 'configure-web-firewall') && steps.install.outcome != 'skipped' }}
        env:
          QUANTA_PUBLIC_ORIGIN: ${{ secrets.QUANTA_PUBLIC_ORIGIN }}
          QUANTA_AUTH_MODE: ${{ secrets.QUANTA_AUTH_MODE }}
          QUANTA_OCI_HOST: ${{ secrets.QUANTA_OCI_HOST }}
        run: python3 -I deploy/oci/probe_public.py
