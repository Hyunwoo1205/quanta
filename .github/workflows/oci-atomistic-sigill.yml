name: OCI fixed atomistic SIGILL diagnosis

on:
  push:
    branches: [ops/oci]
    paths:
      - '.github/oci/atomistic-sigill-request.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: quanta-oci-installation
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.repository == 'Hyunwoo1205/quanta' && github.ref == 'refs/heads/ops/oci' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: oci-preflight
    timeout-minutes: 10
    env:
      QUANTA_ATOMISTIC_SIGILL_CONTROL_SHA: 'c858fdcadd31367b79ee409abc1bbd20003d3ad2'
      QUANTA_ATOMISTIC_SIGILL_CONTROL_CI_RUN: '42360758890'
      QUANTA_CI_READ_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout independently tested fixed diagnostic
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 'c858fdcadd31367b79ee409abc1bbd20003d3ad2'
          path: verified-sigill-control
          persist-credentials: false
      - name: Require independent control CI and the previously verified A03 subject
        id: authorize
        run: python3 -I -B verified-sigill-control/deploy/oci/diagnose_atomistic_sigill.py --authorize
      - name: Install existing-key SSH transport
        run: |
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends putty-tools
      - name: Trace only the cached immutable ARM64 He-D failure
        env:
          QUANTA_ATOMISTIC_SIGILL_OPERATION: ${{ steps.authorize.outputs.operation }}
          QUANTA_ATOMISTIC_SIGILL_SOURCE_SHA: ${{ steps.authorize.outputs.source_sha }}
          QUANTA_ATOMISTIC_SIGILL_REQUEST_ID: ${{ steps.authorize.outputs.request_id }}
          QUANTA_OCI_AUTH_CONFIRMED: 'true'
          QUANTA_OCI_HOST: ${{ secrets.QUANTA_OCI_HOST }}
          QUANTA_OCI_HOST_KEY: ${{ secrets.QUANTA_OCI_HOST_KEY }}
          QUANTA_OCI_PPK: ${{ secrets.QUANTA_OCI_PPK }}
        run: |
          mkdir -p .cache
          python3 -I -B verified-sigill-control/deploy/oci/diagnose_atomistic_sigill.py > .cache/oci-atomistic-sigill.json
      - name: Preserve the bounded diagnostic receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oci-atomistic-sigill-${{ github.sha }}
          path: .cache/oci-atomistic-sigill.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
