name: OCI fixed account application upgrade

on:
  push:
    branches:
      - ops/oci
    paths:
      - .github/oci/accounts-request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: quanta-oci-installation
  cancel-in-progress: false

jobs:
  accounts:
    if: github.repository == 'Hyunwoo1205/quanta' && github.ref == 'refs/heads/ops/oci' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: oci-preflight
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout independently verified fixed control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: CONTROL_SHA_LITERAL
          path: verified-accounts-control
          persist-credentials: false
      - name: Require completed controller and selected application CI
        id: authorize
        env:
          QUANTA_ACCOUNTS_CONTROL_SHA: 'CONTROL_SHA_LITERAL'
          QUANTA_ACCOUNTS_CONTROL_CI_RUN: 'CONTROL_CI_LITERAL'
          QUANTA_CI_READ_TOKEN: ${{ github.token }}
        run: python3 -I -B verified-accounts-control/deploy/oci/authorize_accounts_upgrade.py
      - name: Install existing-key SSH transport
        run: |
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends putty-tools
      - name: Execute the verified fixed account operation
        env:
          QUANTA_ACCOUNTS_CONTROL_SHA: 'CONTROL_SHA_LITERAL'
          QUANTA_ACCOUNTS_CONTROL_CI_RUN: 'CONTROL_CI_LITERAL'
          QUANTA_ACCOUNTS_OPERATION: ${{ steps.authorize.outputs.operation }}
          QUANTA_ACCOUNTS_SOURCE_SHA: ${{ steps.authorize.outputs.source_sha }}
          QUANTA_ACCOUNTS_REQUEST_ID: ${{ steps.authorize.outputs.request_id }}
          QUANTA_OCI_AUTH_CONFIRMED: 'true'
          QUANTA_OCI_HOST: ${{ secrets.QUANTA_OCI_HOST }}
          QUANTA_OCI_HOST_KEY: ${{ secrets.QUANTA_OCI_HOST_KEY }}
          QUANTA_OCI_PPK: ${{ secrets.QUANTA_OCI_PPK }}
          QUANTA_PUBLIC_ORIGIN: ${{ secrets.QUANTA_PUBLIC_ORIGIN }}
          QUANTA_AUTH_MODE: ${{ secrets.QUANTA_AUTH_MODE }}
        run: python3 -I -B verified-accounts-control/deploy/oci/probe_accounts_upgrade.py
