name: OCI application upgrade control checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  application-control:
    name: application control (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            python_architecture: x64
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            python_architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
          architecture: ${{ matrix.python_architecture }}
      - name: Require native CPython runtime
        env:
          QUANTA_EXPECTED_ARCH: ${{ matrix.architecture }}
        run: python -c 'import os, platform; assert platform.python_implementation() == "CPython"; assert platform.python_version() == "3.12.14"; assert platform.system() == "Linux"; assert platform.machine() == os.environ["QUANTA_EXPECTED_ARCH"]'
      - name: Test fixed application authorization, transport, preservation and rollback
        run: python -m unittest discover -s tests -p 'test_oci_application*.py' -v
