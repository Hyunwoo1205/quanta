[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "quanta-research-contracts"
version = "0.15.0"
description = "Validated scientific workflows and a durable asynchronous execution service for Quanta"
readme = "README.md"
requires-python = "==3.12.14"
dependencies = [
  "numpy==2.3.5",
  "scipy==1.17.0",
  "jsonschema==4.26.0",
  "rfc8785==0.1.4",
  "rfc3339-validator==0.1.4",
  "threadpoolctl==3.6.0",
  "uvicorn==0.54.0",
  "PyJWT[crypto]==2.15.1",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
quanta = "quanta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quanta = ["web/*.html", "web/*.css", "web/*.js", "web/*.mjs", "web/*.json"]

[tool.setuptools.data-files]
"share/quanta" = ["requirements.in", "requirements.lock.txt", "requirements.lock.json", "requirements.aarch64.lock.txt", "requirements.aarch64.lock.json"]
"share/quanta/contracts/v0.2.0" = ["contracts/v0.2.0/*.json", "contracts/v0.2.0/README.txt"]
"share/quanta/contracts/v0.2.0/examples" = ["contracts/v0.2.0/examples/*.json"]
"share/quanta/contracts/v0.2.0/module_results" = ["contracts/v0.2.0/module_results/*.json"]
"share/quanta/contracts/v0.3.0" = ["contracts/v0.3.0/*.json", "contracts/v0.3.0/README.txt"]
"share/quanta/contracts/v0.3.0/examples" = ["contracts/v0.3.0/examples/*.json"]
"share/quanta/contracts/v0.3.1" = ["contracts/v0.3.1/*.json", "contracts/v0.3.1/README.txt"]
"share/quanta/contracts/v0.3.1/examples" = ["contracts/v0.3.1/examples/*.json"]
"share/quanta/contracts/v0.4.0" = ["contracts/v0.4.0/*.json", "contracts/v0.4.0/README.txt"]
"share/quanta/contracts/v0.4.0/examples" = ["contracts/v0.4.0/examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
